name: Generate image variants

on:
  push:
    branches: [main]
    paths:
      - 'assets-src/images/**'
      - 'scripts/generateImageVariants.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run images
      - name: Commit generated variants
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --staged --quiet; then
            echo "No image changes."
          else
            git commit -m "chore: regenerate image variants [skip ci]"
            git push
          fi
