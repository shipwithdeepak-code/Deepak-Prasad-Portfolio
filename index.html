        <h1>Deepak Prasad — Senior Product Manager</h1>
        <p>Senior Product Manager with 7+ years of experience across subscriptions, B2B marketplaces, and applied AI. Owned the subscription business through ~15K paying subscribers, built payout systems moving ₹20–25 Cr a month, and shipped an in-app AI coach that grew from ~300 to a peak of ~4,500 DAU after its November 2025 launch. Available to join immediately · Bengaluru.</p>
        <p><em>Note: JavaScript is required for the full interactive portfolio experience and the Dīpa AI copilot. For inquiries, connect with Deepak Prasad on <a href="https://linkedin.com/in/prasad-deepak">LinkedIn</a>.</em></p>

        <h3>Senior Product Manager — Sportstech</h3>
        <p>Oct 2024 – Sep 2026 | via Tejmonvi Softwares (ODC) · Full-time · 200K+ Users</p>
        <p>Owned end-to-end subscription strategy, consumer AI initiatives, and connected product experiences for a digital fitness platform across iOS and Android.</p>
        <ul>
          <li>Took a free app to about 15K paying subscribers in under 3 years, across 200K+ users.</li>
          <li>Shipped the in-app AI Coach (about 4,500 peak daily users) with consent, safety limits, deterministic checks for high-risk cases, Gemini with a ChatGPT fallback, and a 100-user beta first.</li>
          <li>Led AI video recommendations end to end with the data and ML team; workout completion rose 30%+.</li>
          <li>Found that monthly subscribers churned far faster, rebuilt onboarding around the first "aha" moment, won the cancellation A/B tests with a discounted yearly offer and took yearly plans to 87% of paying subscribers. Also led the website checkout launch of Unzer, Google Pay, Apple Pay, Klarna, PayPal and SEPA.</li>
          <li>Built a Lovable and Stripe redemption site that moved about 2,000 of roughly 4,000 free-plan device owners onto paid, auto-renewing plans.</li>
          <li>Shipped 300+ workout videos in Italian, French and Spanish in about 3 weeks (about 10× faster than studio production) with an AI dubbing pipeline and human review.</li>
          <li>Designed a single fitness dashboard that brings workout metrics from iOS, Android, display and Smart Gym into one view, and defined the Performance Score to rate each workout.</li>
          <li>Led the India product team, reporting to the CEO of the India unit: set the roadmap against company OKRs and hired, coached and managed 5 direct reports (3 PMs, growth, content), 2 designers and interns.</li>
        </ul>

        <p>Joined as the first Product Manager on the platform, establishing 0→1 product foundations, user onboarding, and monetization architecture.</p>
        <ul>
          <li>Designed the end-to-end signup, onboarding, trial, pricing packaging, paywall, and checkout experiences from first principles.</li>
          <li>Conducted continuous customer interviews, translating user feedback into PRDs, detailed user stories, and acceptance criteria.</li>
          <li>Partnered closely with engineering and design through iterative sprint releases, establishing the platform’s telemetry tracking foundation.</li>
        </ul>

        <p>Jun 2021 – Aug 2023 | Full-time · B2B Agri-Tech Marketplace · ₹2,000 Cr Platform</p>
        <p>Owned core product delivery across India’s sericulture value chain spanning ~1.1 Lakh stakeholders across 5 verticals (including 80K+ farmers via ReshaFarms).</p>
        <ul>
          <li>Digitised end-to-end workflows across onboarding, KYC, lead gen, sales orders, logistics, and payments integrating LeadSquared CRM (rolled out for about 700 people), Razorpay, SAP, and Camunda.</li>
          <li>Led Instant Payouts workflow: from up to 15 days to seconds for standard payouts and under 2 hours for large ones, as disbursements grew from about ₹10–15 Cr to ₹20–25 Cr a month.</li>
          <li>Built real-time cocoon bidding workflow 0→1 (Scan → Bid → Watch → Win → Pay). Added geofencing and a 15-minute payment window after shared QR codes led to remote bids and non-payment; bidding drove repeat participation.</li>
          <li>Partnered with ML team to productize image-based price recommendation with a human in the loop, piloted at 2 centres.</li>
          <li>Conducted extensive direct field research in mandi collection centres across Karnataka.</li>
        </ul>

        <ul>
          <li>Built automated quote generation engine and BOM-scrubbing tool for complex electronics manufacturing.</li>
          <li>Developed a Raspberry Pi-based AI proof-of-concept for facial-recognition traffic monitoring.</li>
          <li>Worked directly with manufacturing floor engineers to digitise PCB assembly job tracking.</li>
        </ul>

        <h2>Digitising a Complex B2B Marketplace — ReshaMandi</h2>
        <p>Understanding ground-level silk trading workflows and designing connected digital products across farmers, collection centres, payments, and pricing.</p>
        <p>Replaced ad-hoc paper notes and WhatsApp handoffs with a structured digital lot record and a governed payout flow (standard payouts settled within seconds and large ones within 2 hours), contributing to scaling monthly marketplace volume from ~₹10–15 Cr to ₹20–25 Cr across 80,000+ farmers on a ₹2,000 Cr platform. Piloted image-based price recommendations with human-in-the-loop across 2 centres, and added geofenced bidding with timed payment windows.</p>

        <h2>Building a Conversational AI Coach — Sportstech</h2>
        <p>Taking an ambiguous "add AI" idea from concept to production: defining what to build, where to set boundaries, how we chose the models, and what we learned when real users started testing it.</p>
        <p>Spearheaded 0→1 development of conversational in-app AI Coach (Gemini primary, ChatGPT fallback); scaled from ~300 to a peak of ~4,500 DAU after its November 2025 launch behind physiological safety guardrails.</p>

        <h2>Turning a Free Fitness App into a Subscription Business — Sportstech</h2>
        <p>Designing the end-to-end monetization experience: from packaging and paywalls to onboarding, value realization, conversion, and retention.</p>
        <p>Co-authored the FY2025 subscription analysis setting monthly-to-annual migration as the 2026 priority. Supported growing the subscription engine to about 15K paying subscribers and taking yearly plans to 87% of subscribers, while monthly plans lost subscribers far faster than annual plans.</p>

        <h2>One Body. One Score. One Ecosystem. (Product Strategy &amp; PRD)</h2>
        <p>A development-ready product strategy and cross-platform PRD uniting a fragmented connected-fitness ecosystem under a single progress model (unlaunched product strategy &amp; PRD specification).</p>
        <p>Authored the cross-platform PRD, specified the Athletic Reliability Performance Score algorithm, and designed the 3-phase data migration strategy across 5 engineering surfaces (iOS, Android, Display, Smart Gym, Firmware).</p>

        <h2>Scaling Content Localization with AI — Sportstech</h2>
        <p>Redesigning a traditional video-production workflow into an AI-assisted localization pipeline across three European languages.</p>
        <p>Shipped 300+ workout videos across Italian, French, and Spanish in roughly 3 weeks (~10× faster than studio benchmarks), creating a repeatable operational blueprint for rapid market expansion.</p>

        <h2>Behind the AI Copilot: Transparent In-Memory RAG</h2>
        <p>An architectural deep dive into why RAG beats fine-tuning for domain portfolios, why in-memory cosine beats external vector databases at this scale, semantic chunking, and safety-first confidence gating.</p>
        <p>Built with fast CPU in-memory cosine retrieval, zero external database dependencies, 100% citation grounding, and 95% (19 of 20) on a golden evaluation set.</p>
